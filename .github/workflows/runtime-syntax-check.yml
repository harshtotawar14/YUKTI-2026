name: SanPaid Frontend Runtime Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check canonical runtime JavaScript syntax
        run: |
          node --check app.js
          node --check mobile.js
          node --check evaluator-final.js
          node --check auth-unified.js
          node --check connected-runtime-fix.js
          node --check connected-demo.js
          node --check connected-service-ui.js
          node --check connected-commerce-ui.js
          node --check customer-worker-dashboard.js
          node --check judge-demo.js
          node --check top1-polish.js
          node --check admin-command-center.js
          node --check cooperative-portal.js
          node --check federation-portal.js
          node --check cooperative-deploy-guard.js
          node --check handover-evidence.js
          node --check demo-preflight.js
          node --check service-worker.js

      - name: Enforce one connected fetch transport
        run: |
          count=$(grep -R --include='*.js' -F 'window.fetch=' . \
            --exclude-dir=.git --exclude-dir=node_modules | wc -l)
          test "$count" -eq 1 || { echo "Expected exactly one window.fetch wrapper; found $count"; exit 1; }
          grep -F 'window.fetch=async function sanPaidFetch' connected-runtime-fix.js
          grep -F "backend:'same-origin'" connected-runtime-fix.js
          grep -F "mode:'SAME_ORIGIN_AUTHENTICATED_API'" connected-runtime-fix.js

      - name: Enforce one public mobile drawer owner
        run: |
          grep -F 'function wireMobileNavigation' app.js
          grep -F 'function setDrawerOpenState' app.js
          if grep -nE 'function (openDrawer|closeAllDrawers|enhanceLandingDrawer|populateLandingDrawer|wireMobileNavigation)' mobile.js; then
            echo 'mobile.js must not own public navigation; app.js is the canonical mobile drawer owner.'
            exit 1
          fi
          if grep -nE 'menuBtn|mobileDrawer|mobileDrawerScrim|mobile-drawer-open' evaluator-final.js; then
            echo 'evaluator-final.js must not control public mobile navigation.'
            exit 1
          fi
          grep -F 'html body #landing .eval-nav .mobile-drawer' mobile.css

      - name: Verify government handover release markers
        run: |
          grep -F "release:'government-handover-v1'" app.js
          grep -F "runtime:'v65'" app.js
          grep -F "sanpaid-runtime-v65" service-worker.js
          grep -F "root.dataset.animationOwner='evaluator'" evaluator-final.js
          grep -F "root.dataset.animationOwner === 'evaluator'" mobile.js
          grep -F "presentationLayer: 'GOVERNMENT_READY'" top1-polish.js

      - name: Verify connected handover evidence layer
        run: |
          grep -F "handover-evidence.css?v=20260902-1" cooperative-deploy-guard.js
          grep -F "handover-evidence.js?v=20260902-1" cooperative-deploy-guard.js
          grep -F "./handover-evidence.css" service-worker.js
          grep -F "./handover-evidence.js" service-worker.js
          grep -F "/api/cooperative-admin/trust-lifecycle" handover-evidence.js
          grep -F "/api/cooperative-admin/complaints/" handover-evidence.js
          grep -F "No synthetic timeline is substituted." handover-evidence.js
          grep -F "No synthetic worker records are substituted." handover-evidence.js
          if grep -n 'setInterval' handover-evidence.js; then
            echo 'Handover evidence must not add recurring polling.'
            exit 1
          fi

      - name: Reject exposed credentials and legacy admin login
        run: |
          if grep -R -n --include='*.js' -F 'Demo@2026' . --exclude-dir=.git --exclude-dir=node_modules; then
            echo 'Frontend source must not embed the demo password anywhere.'
            exit 1
          fi
          if grep -nE 'const PASSWORD=|data-judge-role=.*login|Password for isolated' judge-demo.js; then
            echo 'Legacy direct administration login returned.'
            exit 1
          fi
          grep -F "legacyJudgeLogin:'RETIRED'" judge-demo.js
          grep -F "administrationAuth:'UNIFIED_ROLE_ACCESS'" judge-demo.js

      - name: Reject evaluator-only public runtime
        run: |
          if grep -nE 'loadPremiumExperience|loadResearchUpgrades|loadTop1Readiness|loadDemoFirstStable|loadSelectionProofV4|loadMasterFinalV4' top1-polish.js; then
            echo 'Evaluator-only decorative runtime must stay retired from government-ready startup.'
            exit 1
          fi
          grep -F "demoPreflight: 'RETIRED_FROM_PUBLIC_UI'" demo-preflight.js
          grep -F "legacyAdminLogin: 'GATED_BY_UNIFIED_AUTH'" demo-preflight.js

      - name: Reject synthetic administrative fallback
        run: |
          if grep -nE 'fillSynthetic|SYNTHETIC DEMO DATA|Demo Worker A|Demo Worker B' cooperative-deploy-guard.js handover-evidence.js; then
            echo 'Administrative runtime must never substitute synthetic operational records.'
            exit 1
          fi
          grep -F 'No synthetic operational data is being substituted.' cooperative-deploy-guard.js

      - name: Reject legacy local state in connected role runtime
        run: |
          for file in auth-unified.js connected-demo.js connected-service-ui.js connected-commerce-ui.js customer-worker-dashboard.js; do
            if grep -nE 'localStorage\.(getItem|setItem)\(' "$file"; then
              echo "Legacy localStorage runtime state found in $file"
              exit 1
            fi
          done

      - name: Reject recurring role-dashboard pollers and observer rewrites
        run: |
          if grep -n 'setInterval' connected-service-ui.js connected-commerce-ui.js customer-worker-dashboard.js; then
            echo 'Connected role modules must use the central snapshot sync instead of recurring setInterval polling.'
            exit 1
          fi
          if grep -n 'MutationObserver' customer-worker-dashboard.js; then
            echo 'Customer/Worker dashboard must not rewrite itself from a whole-page MutationObserver.'
            exit 1
          fi

      - name: Ensure legacy app engine remains retired
        run: |
          grep -F "mode:'CONNECTED_BACKEND_ONLY'" app.js
          if grep -nE 'DEMO_USERS|DEFAULT_WORKERS|function renderCustomerHome|function renderWorkerHome|function paymentModal' app.js; then
            echo 'Legacy local demo engine returned to app.js.'
            exit 1
          fi
