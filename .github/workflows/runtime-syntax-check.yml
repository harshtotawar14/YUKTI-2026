name: SanPaid Frontend Runtime Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check canonical runtime JavaScript syntax
        run: |
          node --check app.js
          node --check mobile.js
          node --check evaluator-final.js
          node --check auth-unified.js
          node --check connected-runtime-fix.js
          node --check connected-demo.js
          node --check connected-service-ui.js
          node --check connected-commerce-ui.js
          node --check customer-worker-dashboard.js
          node --check judge-demo.js
          node --check top1-polish.js
          node --check admin-command-center.js
          node --check cooperative-portal.js
          node --check federation-portal.js
          node --check cooperative-deploy-guard.js
          node --check handover-evidence.js
          node --check service-worker.js

      - name: Enforce explicit API and one sync manager
        run: |
          if grep -nE 'window\.fetch\s*=|window\.EventSource\s*=' connected-runtime-fix.js connected-demo.js; then
            echo 'Global fetch/EventSource monkey patches are forbidden.'
            exit 1
          fi
          grep -F 'window.SanPaidApi=Object.freeze' connected-runtime-fix.js
          grep -F "mode:'EXPLICIT_SAME_ORIGIN_API_CLIENT'" connected-runtime-fix.js
          grep -F 'window.SanPaidSync=Object.freeze' connected-runtime-fix.js
          grep -F "mode:'ONE_ROLE_AWARE_SNAPSHOT_LOOP'" connected-runtime-fix.js
          grep -F 'window.SanPaidSync.subscribe' connected-demo.js
          grep -F 'window.SanPaidSync.refreshNow' connected-demo.js
          if grep -n 'new EventSource' connected-demo.js; then
            echo 'Customer/Worker workspace must use SanPaidSync instead of EventSource.'
            exit 1
          fi

      - name: Enforce one public mobile drawer owner
        run: |
          grep -F 'function wireMobileNavigation' app.js
          grep -F 'function setDrawerOpenState' app.js
          if grep -nE 'function (openDrawer|closeAllDrawers|enhanceLandingDrawer|populateLandingDrawer|wireMobileNavigation)' mobile.js; then
            echo 'mobile.js must not own public navigation; app.js is the canonical mobile drawer owner.'
            exit 1
          fi
          if grep -nE 'menuBtn|mobileDrawer|mobileDrawerScrim|mobile-drawer-open' evaluator-final.js; then
            echo 'evaluator-final.js must not control public mobile navigation.'
            exit 1
          fi

      - name: Verify coherent startup and v67 release
        run: |
          grep -F "release:'government-handover-v3'" app.js
          grep -F "runtime:'v67'" app.js
          grep -F 'sanpaid-runtime-v67' service-worker.js
          grep -F 'design-tokens.css' index.html
          if grep -nE 'mobile-fix\.css|demo-preflight\.js' index.html; then
            echo 'Retired presentation/mobile files must not return to startup.'
            exit 1
          fi
          if grep -nE 'injectGovernmentStyles|polishGovernmentLanding|formalizeTimers|style\.textContent' top1-polish.js; then
            echo 'top1-polish.js must remain a small bootstrap/accessibility coordinator.'
            exit 1
          fi
          grep -F "version:'handover-bootstrap-v1'" top1-polish.js
          grep -F 'loadAdministration,' top1-polish.js
          grep -F 'window.SanPaidBootstrap?.loadAdministration?.();' auth-unified.js
          if sed -n '/function start()/,/^  }/p' top1-polish.js | grep -F 'loadAdministration();'; then
            echo 'Administration assets must stay lazy and role-triggered.'
            exit 1
          fi

      - name: Verify accessibility, discovery and security baseline
        run: |
          grep -F 'class="skip-link" href="#mainContent"' index.html
          grep -F 'id="mainContent" tabindex="-1"' index.html
          grep -F 'rel="canonical"' index.html
          grep -F 'property="og:title"' index.html
          grep -F 'id="catalogStatus"' index.html
          grep -F 'id="catalogRetry"' index.html
          grep -F 'Content-Security-Policy' vercel.json
          if grep -F 'Content-Security-Policy-Report-Only' vercel.json; then
            echo 'CSP must be enforced, not report-only.'
            exit 1
          fi
          test -s robots.txt
          test -s sitemap.xml
          test -s social-preview.svg

      - name: Verify database-backed service catalog
        run: |
          grep -F '/api/public/services' app.js
          grep -F '/api/public/services' connected-demo.js
          grep -F "catalogSource='STATIC_NAMES_ONLY'" app.js
          grep -F 'Current pricing loads after connection' app.js
          if grep -nE "FALLBACK_SERVICES=.*price:|\{name:'[^']+',icon:'[^']+',price:" app.js; then
            echo 'Static fallback must not claim current service pricing.'
            exit 1
          fi

      - name: Verify deployed catalog contract
        run: |
          response_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            --output "$response_file" \
            https://yukti-2026-liart.vercel.app/api/public/services
          node - "$response_file" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload.ok !== true || payload.source !== 'DATABASE_CONFIGURATION') {
            throw new Error('Public catalog is not connected to database configuration.');
          }
          if (!Array.isArray(payload.services) || payload.services.length < 10) {
            throw new Error('Public catalog returned too few services.');
          }
          const invalid = payload.services.find(service => !service.name || !Number.isFinite(Number(service.basePrice)));
          if (invalid) throw new Error('Public catalog contains an invalid service contract.');
          console.log(`Verified ${payload.services.length} database-backed services.`);
          NODE

      - name: Verify matching truth on public landing
        run: |
          grep -F 'STATIC EXPLANATORY SCENARIO — NOT LIVE ASSIGNMENT' index.html
          grep -F 'DEMO DISTANCE, not live Maps route distance' index.html
          grep -F 'same backend policy engine' index.html
          grep -F 'Demo Policy Example: 20 km' index.html

      - name: Verify connected handover evidence layer
        run: |
          grep -F "handover-evidence.css" top1-polish.js
          grep -F "handover-evidence.js" top1-polish.js
          grep -F './handover-evidence.css' service-worker.js
          grep -F './handover-evidence.js' service-worker.js
          grep -F '/api/cooperative-admin/trust-lifecycle' handover-evidence.js
          grep -F '/api/cooperative-admin/complaints/' handover-evidence.js
          grep -F 'No synthetic timeline is substituted.' handover-evidence.js
          grep -F 'No synthetic worker records are substituted.' handover-evidence.js
          if grep -nE 'handover-evidence\.(js|css)' cooperative-deploy-guard.js; then
            echo 'Availability guard must not load evidence assets; top1-polish.js is the single owner.'
            exit 1
          fi
          if grep -n 'setInterval' handover-evidence.js; then
            echo 'Handover evidence must not add recurring polling.'
            exit 1
          fi

      - name: Reject exposed credentials and synthetic administration
        run: |
          if grep -R -n --include='*.js' -F 'Demo@2026' . --exclude-dir=.git --exclude-dir=node_modules; then
            echo 'Frontend source must not embed a demo password.'
            exit 1
          fi
          if grep -nE 'const PASSWORD=|Password for isolated' judge-demo.js; then
            echo 'Legacy direct administration login returned.'
            exit 1
          fi
          if grep -nE 'fillSynthetic|SYNTHETIC DEMO DATA|Demo Worker A|Demo Worker B' cooperative-deploy-guard.js handover-evidence.js; then
            echo 'Administrative runtime must never substitute synthetic operational records.'
            exit 1
          fi
          grep -F 'No synthetic operational data is being substituted.' cooperative-deploy-guard.js

      - name: Reject legacy role state and recurring role pollers
        run: |
          for file in auth-unified.js connected-demo.js connected-service-ui.js connected-commerce-ui.js customer-worker-dashboard.js; do
            if grep -nE 'localStorage\.(getItem|setItem)\(' "$file"; then
              echo "Legacy localStorage runtime state found in $file"
              exit 1
            fi
          done
          if grep -n 'setInterval' connected-service-ui.js connected-commerce-ui.js customer-worker-dashboard.js; then
            echo 'Connected role modules must use central sync events instead of recurring setInterval polling.'
            exit 1
          fi
          if grep -n 'MutationObserver' customer-worker-dashboard.js; then
            echo 'Customer/Worker dashboard must not rewrite itself from a whole-page MutationObserver.'
            exit 1
          fi

      - name: Verify service worker truth
        run: |
          grep -F "if(url.pathname.startsWith('/api/'))return" service-worker.js
          grep -F "fetch(request,{cache:'no-store'})" service-worker.js
