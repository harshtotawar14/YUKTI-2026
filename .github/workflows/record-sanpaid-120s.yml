name: Capture SanPaid Admin Proof Screens

on:
  push:
    branches:
      - recording-90sec-20260920

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture live federation screens
        env:
          TARGET_URL: https://yukti-2026-brown.vercel.app/
        run: |
          mkdir -p proof
          cat > capture-proof.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1920,height:1080},deviceScaleFactor:1,colorScheme:'light'});
          const page=await context.newPage();
          page.setDefaultTimeout(20000);
          await page.goto(process.env.TARGET_URL,{waitUntil:'domcontentloaded',timeout:120000});
          await page.waitForLoadState('networkidle',{timeout:30000}).catch(()=>{});
          const demo=await page.evaluate(async()=>{const r=await fetch('/api/auth/demo-access',{cache:'no-store'});return r.json();});
          const account=(demo.accounts||[]).find(a=>a.role==='FEDERATION_ADMIN');
          if(!demo.ok||!account)throw new Error('Federation demo access unavailable');
          await page.evaluate(async ({identifier,password})=>{
            try{await window.SanPaidAuth?.logout?.({silent:true});}catch{}
            await window.SanPaidAuth.login({identifier,password,role:'FEDERATION_ADMIN',remember:false});
            await window.SanPaidAuth.openRoleWorkspace('FEDERATION_ADMIN',null);
          },{identifier:account.accessId,password:demo.password});
          await page.waitForTimeout(3500);

          const cap=page.locator(':text-is("Capacity Exchange"):visible').first();
          await cap.click();
          await page.waitForTimeout(3500);
          await page.screenshot({path:'proof/capacity-exchange.png',fullPage:false});

          const plan=page.locator(':text-is("Demand, Capacity & Skills"):visible').first();
          await plan.click();
          await page.waitForTimeout(3500);
          await page.screenshot({path:'proof/demand-capacity-skills.png',fullPage:false});

          await browser.close();
          NODE
          node capture-proof.mjs
      - name: Upload proof screens
        uses: actions/upload-artifact@v4
        with:
          name: sanpaid-admin-proof-screens
          path: proof/*.png
          if-no-files-found: error
          retention-days: 7
