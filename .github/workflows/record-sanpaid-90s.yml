name: Generate SanPaid Human Voice

on:
  push:
    branches:
      - recording-90sec-20260920

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install neural TTS
        run: pip install edge-tts

      - name: Generate natural Indian-English narration
        run: |
          mkdir -p narration

          # Prefer a modern Indian-English male neural voice, with a stable fallback.
          if edge-tts --list-voices | grep -q "en-IN-ArjunNeural"; then
            VOICE="en-IN-ArjunNeural"
          else
            VOICE="en-IN-PrabhatNeural"
          fi
          echo "Using voice: $VOICE"

          edge-tts --voice "$VOICE" --rate="-3%" --volume="+0%"             --text "This is SanPaid, a cooperative-owned local workforce network. It connects customers, verified workers and cooperatives through one trusted service system."             --write-media narration/01-intro.mp3

          edge-tts --voice "$VOICE" --rate="-3%" --volume="+0%"             --text "Customers need trusted workers, workers need fair jobs, and cooperatives need one connected system."             --write-media narration/02-problem.mp3

          edge-tts --voice "$VOICE" --rate="-3%" --volume="+0%"             --text "SanPaid adds Capacity Exchange for shortages, and demand-based planning for future skills."             --write-media narration/03-usps.mp3

          edge-tts --voice "$VOICE" --rate="-3%" --volume="+0%"             --text "Matching starts with eligibility, not just distance. The system first checks verification, skill and availability. Only eligible workers are ranked, so the process stays fair and explainable."             --write-media narration/04-matching.mp3

          edge-tts --voice "$VOICE" --rate="-3%" --volume="+0%"             --text "If one worker declines, the same request moves to the next eligible worker."             --write-media narration/05-worker-choice.mp3

          edge-tts --voice "$VOICE" --rate="-3%" --volume="+0%"             --text "Service starts only after the worker is verified and the customer confirms."             --write-media narration/06-trust.mp3

          edge-tts --voice "$VOICE" --rate="-3%" --volume="+0%"             --text "Admins can track workers, services, complaints and capacity from one command center."             --write-media narration/07-governance.mp3

          edge-tts --voice "$VOICE" --rate="-3%" --volume="+0%"             --text "Nearby cooperatives can help during shortages, with worker consent and approval. Serve today. Prepare tomorrow."             --write-media narration/08-capacity.mp3

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: sanpaid-human-voice-segments
          path: narration/*.mp3
          if-no-files-found: error
          retention-days: 7
