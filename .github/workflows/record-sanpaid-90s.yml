name: Generate SanPaid Final Rich Narration

on:
  push:
    branches:
      - recording-90sec-20260920

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural TTS
        run: pip install edge-tts
      - name: Generate final narration
        run: |
          mkdir -p narration
          if edge-tts --list-voices | grep -q "en-IN-ArjunNeural"; then
            VOICE="en-IN-ArjunNeural"
          else
            VOICE="en-IN-PrabhatNeural"
          fi
          RATE="+10%"

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "This is SanPaid, a cooperative-owned local workforce network connecting customers, verified workers and cooperatives through one trusted service journey."             --write-media narration/01-intro.mp3

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "Customers need trusted local workers, workers need fair job opportunities, and cooperatives need one connected system to manage them."             --write-media narration/02-problem.mp3

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "SanPaid has two key ideas: Capacity Exchange for local shortages, and a Demand-to-Workforce Loop that helps cooperatives identify future skill needs."             --write-media narration/03-usps.mp3

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "Matching is eligibility first, not distance first. SanPaid checks worker verification, required skill, availability and service radius before ranking. A nearby unverified worker cannot outrank a verified eligible worker, making matching fair and explainable."             --write-media narration/04-matching.mp3

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "Workers keep their choice. They can accept or decline. If one worker declines, the same customer request automatically continues to the next eligible worker."             --write-media narration/05-worker-choice.mp3

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "Before work begins, the booked worker is verified and the customer confirms the worker through the service-linked verification flow. Both checks are required."             --write-media narration/06-trust.mp3

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "The cooperative command center brings together verified workers, active services, complaints, capacity gaps, billing and audit records for accountable operations."             --write-media narration/07-governance.mp3

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "If local capacity is low, a nearby cooperative can provide support, but worker consent and authorization remain required. SanPaid: serve today, prepare tomorrow."             --write-media narration/08-capacity.mp3

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: sanpaid-final-rich-voice-segments
          path: narration/*.mp3
          if-no-files-found: error
          retention-days: 7
