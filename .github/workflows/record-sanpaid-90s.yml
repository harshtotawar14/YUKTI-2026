name: Generate SanPaid Rich Narration

on:
  push:
    branches:
      - recording-90sec-20260920

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural TTS
        run: pip install edge-tts
      - name: Generate richer narration with same voice
        run: |
          mkdir -p narration
          if edge-tts --list-voices | grep -q "en-IN-ArjunNeural"; then
            VOICE="en-IN-ArjunNeural"
          else
            VOICE="en-IN-PrabhatNeural"
          fi
          echo "Using voice: $VOICE"
          RATE="+6%"

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "This is SanPaid, a cooperative-owned local workforce network. It connects customers, verified workers and cooperatives in one accountable service journey, from request to verified delivery and service record."             --write-media narration/01-intro.mp3

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "The core problem is coordination. Customers need trusted local workers, workers need fair access to jobs, and cooperatives need one clear system to manage service, trust and workforce capacity."             --write-media narration/02-problem.mp3

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "SanPaid adds two important ideas. Capacity Exchange brings support from a nearby cooperative when local capacity is low. The Demand-to-Workforce Loop turns repeated shortages into useful signals for training and onboarding."             --write-media narration/03-usps.mp3

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "Matching is eligibility first, not distance first. SanPaid checks verification, required skill, availability and service radius before ranking. So a closer but unverified worker cannot outrank a verified eligible worker. Ranking then considers suitability in a transparent way."             --write-media narration/04-matching.mp3

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "Workers also keep their choice. They can accept or decline a job. If Worker A declines, the same customer request continues to the next eligible worker, so the customer does not need to create the booking again."             --write-media narration/05-worker-choice.mp3

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "Trust is checked at service start. The booked worker is verified, and the customer confirms the worker using the service-linked verification flow. Only after both checks can the service begin."             --write-media narration/06-trust.mp3

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "For cooperative admins, one command center brings together verified workers, active services, complaints, capacity gaps and operational records. This makes local service delivery easier to monitor and review."             --write-media narration/07-governance.mp3

          edge-tts --voice "$VOICE" --rate="$RATE"             --text "And when local capacity is short, SanPaid can request support from a nearby cooperative. The worker still gives consent, and the assignment remains authorized and traceable. SanPaid: serve today, prepare tomorrow."             --write-media narration/08-capacity.mp3

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: sanpaid-rich-voice-segments
          path: narration/*.mp3
          if-no-files-found: error
          retention-days: 7
