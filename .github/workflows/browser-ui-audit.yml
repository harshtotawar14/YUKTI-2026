name: SanPaid Browser UI Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ui-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Build local frontend artifact
        run: npm run build
      - name: Install Playwright core without changing the repository
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Run local Chromium button and dialog audit
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/browser-ui-audit.mjs
