name: SanPaid Browser UI Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ui-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Build local frontend artifact
        run: npm run build
      - name: Verify selection integrity runtime is shipped
        run: |
          test -s dist/selection-integrity-v2.js
          grep -F 'LOCAL_CAPACITY_EXHAUSTED' dist/selection-integrity-v2.js
          grep -F 'Human-reviewed forecasting (pilot)' dist/selection-integrity-v2.js
          grep -F 'Start Fresh Review' dist/selection-integrity-v2.js
          grep -F 'selection-integrity-v2.js?v=' dist/index.html
          grep -F '"selectionIntegrity": "CLOSED_LOOP_V2"' dist/build-info.json
      - name: Install Playwright core without changing the repository
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Verify DB-independent SIH review runtime
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/review-runtime-ui-audit.mjs
      - name: Verify final Customer and Worker role UI
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/customer-mobile-ui-audit.mjs
      - name: Verify final Cooperative and Federation admin UI
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/admin-final-ui-audit.mjs
      - name: Run broader Chromium button and dialog audit
        continue-on-error: true
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/browser-ui-audit.mjs
