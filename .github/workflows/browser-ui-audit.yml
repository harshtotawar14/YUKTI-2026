name: SanPaid Browser UI Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ui-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Build local frontend artifact
        run: npm run build
      - name: Install Playwright core without changing the repository
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Verify DB-independent SIH review runtime
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/review-runtime-ui-audit.mjs
      - name: Verify final Customer and Worker mobile UI
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/customer-mobile-ui-audit.mjs
      - name: Verify final Worker desktop UI
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/worker-desktop-ui-audit.mjs
      - name: Verify final Cooperative and Federation admin UI
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/final-admin-ui-audit.mjs
      - name: Run broader Chromium button and dialog audit
        continue-on-error: true
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/browser-ui-audit.mjs
