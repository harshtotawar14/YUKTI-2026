name: Generate Clear Slow 2min Voice

on:
  push:
    branches:
      - recording-90sec-20260920

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TTS
        run: pip install edge-tts
      - name: Generate clear narration
        shell: bash
        run: |
          set -e
          mkdir -p clearvoice
          VOICE="en-IN-PrabhatNeural"
          if edge-tts --list-voices | grep -q "en-IN-ArjunNeural"; then VOICE="en-IN-ArjunNeural"; fi
          RATE="-8%"
          tts(){ local txt="$1"; local out="$2"; for i in 1 2 3; do edge-tts --voice "$VOICE" --rate="$RATE" --text "$txt" --write-media "$out" && return 0; sleep 3; done; return 1; }

          tts "SanPaid is a cooperative-owned local workforce network connecting customers, verified workers and cooperatives in one trusted system." clearvoice/01-intro.mp3

          tts "The customer selects a service and location, then explains the problem using text, photo or voice. SanPaid checks verified eligible workers." clearvoice/02-customer.mp3

          tts "Workers receive only suitable job requests. They can review the customer problem and matching reason, then accept or decline freely." clearvoice/03-worker.mp3

          tts "Service starts only after two checks: worker verification and customer confirmation. Without both, work cannot begin." clearvoice/04-trust.mp3

          tts "The Cooperative Admin manages workers, services, complaints, SLA, payments and local capacity from one dashboard." clearvoice/05-coop.mp3

          tts "The Federation Admin monitors regional capacity, escalations, demand patterns and cooperative coordination." clearvoice/06-fed.mp3

          tts "If local capacity is low, a nearby cooperative can help. Worker consent and authorized approval are required." clearvoice/07-capacity.mp3

          tts "Demand and shortage data reveal skill gaps for human-reviewed training and onboarding. AI advises; the cooperative decides." clearvoice/08-planning.mp3

          tts "The design is backed by field research, a recorded stakeholder discussion and signed evidence." clearvoice/09-evidence.mp3

          tts "SanPaid. Serve today. Prepare tomorrow." clearvoice/10-end.mp3

          for f in clearvoice/*.mp3; do
            echo "$(basename "$f") $(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f" 2>/dev/null || true)"
          done

      - name: Upload voice
        uses: actions/upload-artifact@v4
        with:
          name: sanpaid-clear-slow-2min-voice
          path: clearvoice/*.mp3
          retention-days: 7
