<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Local First. Cooperative Support.</title><desc id="d">Local cooperative capacity can be supported by a nearby cooperative when needed.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FCFF"/><stop offset="1" stop-color="#EEF8F4"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0B3B75" flood-opacity=".12"/></filter></defs><rect width="1600" height="900" rx="44" fill="url(#bg)"/><g transform="translate(110 120)"><text x="0" y="0" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0E9F83">SANPAID</text><text x="0" y="118" font-family="Arial,sans-serif" font-size="76" font-weight="800" fill="#0B3B75">Local First.</text><text x="0" y="206" font-family="Arial,sans-serif" font-size="76" font-weight="800" fill="#0B3B75">Cooperative Support.</text><text x="0" y="280" font-family="Arial,sans-serif" font-size="29" fill="#5B738E">Use local capacity first. Ask the nearby network only when needed.</text></g><g transform="translate(160 430)" filter="url(#sh)"><rect width="470" height="250" rx="36" fill="#fff" stroke="#D7E5EF" stroke-width="3"/><rect x="38" y="38" width="394" height="52" rx="26" fill="#EAF8F3"/><text x="235" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#0E7F6D">LOCAL COOPERATIVE</text><path d="M115 190V126l120-74 120 74v64" transform="translate(0 35)" fill="#EAF4FC" stroke="#0B3B75" stroke-width="10" stroke-linejoin="round"/><path d="M210 225v-60h50v60" fill="#fff" stroke="#0B3B75" stroke-width="8"/><circle cx="380" cy="190" r="32" fill="#0E9F83"/><path d="M365 190l10 10 21-25" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g><g transform="translate(970 430)" filter="url(#sh)"><rect width="470" height="250" rx="36" fill="#fff" stroke="#D7E5EF" stroke-width="3"/><rect x="38" y="38" width="394" height="52" rx="26" fill="#EEF4FB"/><text x="235" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#0B3B75">NEARBY COOPERATIVE</text><path d="M115 190V126l120-74 120 74v64" transform="translate(0 35)" fill="#F2F7FB" stroke="#0B5C9B" stroke-width="10" stroke-linejoin="round"/><path d="M210 225v-60h50v60" fill="#fff" stroke="#0B5C9B" stroke-width="8"/></g><g transform="translate(655 485)"><rect width="285" height="138" rx="69" fill="#0B3B75"/><path d="M62 69h145" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M177 39l38 30-38 30" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#DDEBFA">WHEN LOCAL CAPACITY IS LOW</text></g><g transform="translate(380 730)" font-family="Arial,sans-serif"><rect width="840" height="82" rx="41" fill="#fff" stroke="#D9E5ED"/><text x="95" y="51" font-size="24" font-weight="700" fill="#0B3B75">Local first</text><circle cx="245" cy="41" r="7" fill="#A4B6C7"/><text x="285" y="51" font-size="24" font-weight="700" fill="#0B3B75">Worker consent</text><circle cx="500" cy="41" r="7" fill="#A4B6C7"/><text x="540" y="51" font-size="24" font-weight="700" fill="#0B3B75">Authorized support</text></g></svg>